# Render Blueprint Specification for VibeChat
# Deploy with 1 click via https://dashboard.render.com/blueprints

version: "1"

services:
  # Main Full-Stack Web Service (Next.js + Socket.IO)
  - type: web
    name: vibechat
    env: node
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run server
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vibechat-db
          property: connectionString
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_SOCKET_URL
        sync: false

# Free Managed PostgreSQL Database
databases:
  - name: vibechat-db
    databaseName: vibechat
    user: vibechat_user
    plan: free
    region: oregon
