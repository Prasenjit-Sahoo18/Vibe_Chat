services:
  - type: web
    name: vibechat
    env: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run server
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: vibechat-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: https://vibechat.onrender.com
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://vibechat.onrender.com
      - key: SOCKET_PORT
        value: 10000
      - key: AI_API_KEY
        value: ""
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: CLOUDINARY_CLOUD_NAME
        value: ""
      - key: CLOUDINARY_API_KEY
        value: ""
      - key: CLOUDINARY_API_SECRET
        value: ""
      - key: RAZORPAY_KEY_ID
        value: rzp_test_vibechat_demo
      - key: RAZORPAY_KEY_SECRET
        value: demo_secret_key_vibechat
      - key: STRIPE_SECRET_KEY
        value: sk_test_vibechat_demo
      - key: STRIPE_WEBHOOK_SECRET
        value: whsec_demo_vibechat

databases:
  - name: vibechat-db
    databaseName: vibechat
    user: vibechat
    plan: free
